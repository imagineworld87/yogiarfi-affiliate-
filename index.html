<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopee Affiliate</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
}

.header{
  background:#ff5a1f;
  padding:15px;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.info{
  padding:10px;
}

.price{
  color:#ff5a1f;
  font-weight:bold;
}

.btn{
  background:#ff5a1f;
  color:white;
  text-align:center;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
Shopee Affiliate
</div>

<div class="products">

<div class="card">
<img src="https://picsum.photos/300/300?1">
<div class="info">
TWS Bluetooth
<div class="price">Rp 134.000</div>
<div class="btn">BELI</div>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/300?2">
<div class="info">
Kaos Oversize
<div class="price">Rp 37.500</div>
<div class="btn">BELI</div>
</div>
</div>

</div>

</body>
</html>
